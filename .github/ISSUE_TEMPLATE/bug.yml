name: Bug report
description: rally accepts, rejects, answers or documents something it should not.
labels: [bug]
body:
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `go list -m github.com/r-witz/rally` and `go version`.
      placeholder: github.com/r-witz/rally v0.1.0, go1.27.4 linux/amd64
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Code
      description: The smallest handler that shows the problem.
      render: go
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Request
      description: The request that triggers it, for example as a curl command.
      render: shell
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: The status and body, the panic message, or the part of the OpenAPI document.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: If a specification says so, link the section (RFC 8259, JSON Schema 2020-12, RFC 3339, RFC 9110, OpenAPI 3.1.2...).
    validations:
      required: true
