name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: go mod tidy
        run: |
          go mod tidy -diff
          cd tests && go mod tidy -diff
      - name: go vet
        run: |
          go vet ./...
          cd tests && go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 -tests=false ./...
      - name: govulncheck
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
          cd tests && go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: [1.27.x, stable]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - id: go
        run: echo "version=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: test-${{ steps.go.outputs.version }}-${{ hashFiles('**/go.sum') }}
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: rally
        run: |
          go test -race -coverprofile=coverage.out .
          go tool cover -func=coverage.out | tail -1
      - name: internal/pattern
        run: go test -cover ./internal/pattern
      - name: tests/spec and tests/bench
        working-directory: tests
        run: |
          go test -race ./...
          go test -run TestRallyAllocations ./bench

  fuzz:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: FuzzDecode, package: . }
          - { target: FuzzScanner, package: . }
          - { target: FuzzQuery, package: . }
          - { target: FuzzDecimal, package: . }
          - { target: FuzzPattern, package: ./internal/pattern }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - id: go
        run: echo "version=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: fuzz-${{ matrix.target }}-${{ steps.go.outputs.version }}-${{ github.run_id }}
          restore-keys: fuzz-${{ matrix.target }}-${{ steps.go.outputs.version }}-
      - run: go test -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 60s ${{ matrix.package }}
